<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/biblioteca/loging/public /style.css">
    <title>Login</title>
</head>
<body>
   <div class="container">
        <div class="card">
            <div class="icone-login">📚</div>
            <h1>Acesso ao Sistema</h1>
            <p class="subtitulo">Insira suas credenciais para gerenciar os livros.</p>

            <form id="formLogin" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <div class="links-uteis">
                <p>Esqueceu a senha? <a href="#">Recuperar aqui</a></p>
            </div>
        </div>
    </div>
</body>
</html>
