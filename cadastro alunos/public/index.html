<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastramento de Aluno</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="container">
        <h2>Cadastramento de Aluno</h2>
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" min="1" max="120" placeholder="Ex: 15" required>
                </div>
            </div>

            <div class="form-group">
                <label for="endereco">Endereço:</label>
                <textarea id="endereco" name="endereco" placeholder="Rua, Número, Bairro, Cidade - UF" required></textarea>
            </div>

            <div class="form-group">
                <label for="turma">Turma:</label>
                <input type="text" id="turma" name="turma" placeholder="Ex: 3º Ano B" required>
            </div>

            <button type="submit" class="btn-submit">Enviar Cadastro</button>

        </form>
    </div>
<script src="./js/script.js"></script>
</body>
</html>
