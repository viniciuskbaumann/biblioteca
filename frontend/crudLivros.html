<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Cadastro de Livros</h1>
            <p class="subtitulo">Cadastre novos livros no sistema.</p>

            <form id="formLivro">

                <input
                    type="text"
                    id="titulo"
                    placeholder="Título"
                    required>

                <input
                    type="text"
                    id="autor"
                    placeholder="Autor"
                    required>

                <input
                    type="number"
                    id="ano"
                    placeholder="Ano de publicação"
                    required>

                <button type="submit">
                    Cadastrar Livro
                </button>

            </form>

        </div>

        <div class="card">

            <h2>Livros Cadastrados</h2>

            <div id="listaLivros"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
